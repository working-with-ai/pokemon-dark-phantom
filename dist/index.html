<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="一局童年，经典游戏平台。在浏览器里重温 GBA、FC 与街机游戏，支持键盘、手柄、触屏和本地存档。">
  <title>一局童年 · 经典游戏平台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <strong>一局童年</strong>
      <span>RETRO ARCADE</span>
      <i class="boot-spinner"></i>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="主导航" hidden>
    <a class="tab-item" data-tab="/" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.4 10.5V20h11.2v-9.5"/><path d="M10.2 20v-5.1h3.6V20"/></svg>
      <span>首页</span>
    </a>
    <a class="tab-item" data-tab="/discover" href="#/discover">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="m14.8 9.2-1.8 4-4 1.8 1.8-4z"/></svg>
      <span>发现</span>
    </a>
    <a class="tab-item" data-tab="/search" href="#/search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.4"/><path d="m15.8 15.8 4.1 4.1"/></svg>
      <span>搜索</span>
    </a>
    <a class="tab-item" data-tab="/my" href="#/my">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.6 20c.5-3.4 3-5.3 6.4-5.3s5.9 1.9 6.4 5.3"/></svg>
      <span>个人</span>
    </a>
  </nav>

  <div id="toast" class="toast-wrap" aria-live="polite" aria-atomic="false"></div>

  <script src="runtime/libemu.js"></script>
  <script src="runtime/Sound.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
